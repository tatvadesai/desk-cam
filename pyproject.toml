[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-cam"
version = "0.1.0"
description = "Capture handwritten math and notes from any webcam or iPhone into editable Markdown + LaTeX."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
desk-cam = "desk_cam:main"

[tool.setuptools]
py-modules = ["desk_cam"]
